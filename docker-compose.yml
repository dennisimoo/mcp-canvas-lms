version: "3.9"

services:
  canvas-mcp:
    build: .
    # Remove or rename this line to avoid conflicts
    # container_name: canvas-mcp
    env_file: .env
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - CANVAS_MAX_RETRIES=3
      - CANVAS_RETRY_DELAY=1000
      - CANVAS_TIMEOUT=30000
      - SERVER_MODE=http
      - HTTP_PORT=8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ./logs:/app/logs:rw
    networks:
      - canvas_network

networks:
  canvas_network:
    driver: bridge
